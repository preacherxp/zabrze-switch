# Tests the scene, then records the full switch whenever it changes and commits the MP4 the demo links to.
name: Export video
on:
  push:
    branches: [main]
    paths: ['city-switch.js', 'zabrze.js', 'index.html', 'tools/capture-switch.cjs', '.github/workflows/export-video.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: export-video
  cancel-in-progress: true
jobs:
  export:
    runs-on: ubuntu-latest
    # Chromium and its system libraries come ready in this image, so nothing is installed with apt.
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: preacherxp/city-switches
          path: .central
      - name: Test the scene and its composition
        run: |
          if [ -f test-scene.cjs ]; then node test-scene.cjs; fi
          # The composition check reads a city from the central layout, so stand this checkout in it.
          mkdir -p .central/repos && rm -rf .central/repos/zabrze-switch
          ln -s "$PWD" .central/repos/zabrze-switch
          node .central/tools/check-composition.cjs zabrze
          rm -rf .central
      - name: Install the recorder, encoder and a static server
        run: npm install --prefix "$RUNNER_TEMP/recording" playwright@1.56.1 ffmpeg-static@5 ffprobe-static@3 http-server@14
      - name: Review and capture the full switch
        run: |
          tools="$RUNNER_TEMP/recording/node_modules"
          "$tools/.bin/http-server" . -p 8080 -c-1 > "$RUNNER_TEMP/http.log" 2>&1 &
          CAPTURE_ROOT=. CAPTURE_PATH=/ NODE_PATH="$tools" node tools/capture-switch.cjs zabrze
          "$tools/ffmpeg-static/ffmpeg" -y -framerate 60 -i capture/zabrze/frames/%03d.png -c:v libx264 -crf 18 -pix_fmt yuv420p -movflags +faststart zabrze-day-night-60fps.mp4
          "$tools/ffprobe-static/bin/linux/x64/ffprobe" -v error -select_streams v -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -of csv=p=0 zabrze-day-night-60fps.mp4
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: zabrze-review
          path: |
            capture/zabrze/*.png
            capture/zabrze/*.json
          retention-days: 7
      - name: Commit the video if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git add zabrze-day-night-60fps.mp4
          if git diff --cached --quiet; then echo "Video unchanged"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Export the day/night video for ${GITHUB_SHA::7}"
          git pull --rebase origin main
          git push origin HEAD:main
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds" || echo "Pages build request failed; the push may already have triggered one"
